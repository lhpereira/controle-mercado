<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Controle Mercado{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.dashboard') }}">
      <span class="brand-mark">CM</span>
      <span><strong>Controle Mercado</strong><small>Compras inteligentes</small></span>
    </a>
    <nav>
      <a href="{{ url_for('main.dashboard') }}">Painel</a>
      <a href="{{ url_for('main.receipts') }}">Cupons</a>
      <a href="{{ url_for('main.products') }}">Produtos</a>
      <a class="primary-link" href="{{ url_for('main.new_receipt') }}">+ Novo cupom</a>
    </nav>
  </header>
  <main class="page">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
